<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    /* 视觉方向：克制精确（近黑白 + 一处强调蓝）。控件、字体、间距统一走这里定义的变量。 */
    :root {
      --ink: #101114;
      --ink-2: #3d4148;
      --ink-3: #6a707d;
      --hair: rgba(16, 17, 20, 0.1);
      --hair-2: rgba(16, 17, 20, 0.06);
      --surface: #ffffff;
      --canvas: #f5f5f4;
      --accent: #3355d1;
      --accent-2: #2a48a8;
      --accent-soft: rgba(51, 85, 209, 0.1);
      --accent-line: rgba(51, 85, 209, 0.38);
      --ok: #1f7a4d;
      --err: #b42318;
      --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--surface);
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--accent-soft); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb {
      background: rgba(16, 17, 20, 0.16);
      border-radius: 99px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-track { background: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

    /* ---- 头部：深色渐变带，Logo 用强调蓝 ---- */
    .header {
      display: flex; align-items: center; gap: 11px;
      padding: 13px 16px;
      background: linear-gradient(150deg, #14161b 0%, #1e2129 60%, #262a37 100%);
      color: #fff;
    }
    .logo {
      width: 32px; height: 32px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #4d6cf0, #2b48b8);
      color: #fff;
      border-radius: 9px;
      font-size: 15px; font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 2px 5px rgba(0, 0, 0, 0.28);
    }
    .header h1 { font-size: 13.5px; margin: 0; font-weight: 600; color: #fff; letter-spacing: -0.01em; }
    .header .sub { margin: 2px 0 0; font-size: 11px; color: rgba(255, 255, 255, 0.55); }
    .header .switch { margin-left: auto; }
    .header .slider { background: rgba(255, 255, 255, 0.24); }

    /* ---- 主体：白色纸张 + 发丝分隔线，无卡片 ---- */
    .body { display: flex; flex-direction: column; }
    .section { padding: 12px 16px; border-top: 1px solid var(--hair-2); }
    .section:first-child { border-top: 0; }
    .section-title {
      display: flex; align-items: center; gap: 7px;
      font-size: 11px; font-weight: 600; color: var(--ink-3);
      letter-spacing: 0.1em; margin-bottom: 8px;
    }
    .section-title::before {
      content: ""; width: 3px; height: 11px; border-radius: 2px;
      background: var(--accent); opacity: 0.6; flex-shrink: 0;
    }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; }
    .row > span { display: flex; align-items: center; gap: 7px; font-size: 12.5px; min-width: 0; }
    .row + .row { border-top: 1px solid var(--hair-2); }

    select, input[type="text"], input[type="password"] {
      height: 30px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--hair);
      font-size: 12px; background: var(--surface); color: var(--ink); outline: none;
      caret-color: var(--accent);
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    select { max-width: 178px; }
    select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* ---- AI 配置区 ---- */
    .ai-box {
      display: none; margin-top: 8px;
      background: var(--canvas);
      border: 1px solid var(--hair-2); border-radius: 11px;
      padding: 11px;
    }
    .ai-box.show { display: block; }
    .field { margin-bottom: 9px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 4px; letter-spacing: 0.02em; }
    .field input, .field select { width: 100%; }

    /* ---- 状态提示 ---- */
    .hint { color: var(--ink-3); font-size: 12px; line-height: 1.6; margin-top: 8px; }
    .hint:empty { display: none; }
    .hint a { color: var(--accent); text-decoration: none; }
    .hint a:hover { text-decoration: underline; text-underline-offset: 2px; }
    .badge {
      display: inline-flex; align-items: center; white-space: nowrap;
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
      background: var(--canvas); color: var(--ink-2); border: 1px solid var(--hair-2);
    }
    kbd {
      font-family: var(--mono); font-size: 11px; padding: 1px 5px;
      border: 1px solid var(--hair); border-radius: 5px; background: var(--canvas); color: var(--ink-2);
    }

    /* ---- 开关 ---- */
    label.switch { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
    label.switch input { display: none; }
    .slider {
      position: absolute; inset: 0; background: #d9d9d6; border-radius: 99px;
      cursor: pointer; transition: background 0.18s ease;
    }
    .slider:before {
      content: ""; position: absolute; height: 14px; width: 14px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%;
      transition: transform 0.18s ease; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.22);
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider:before { transform: translateX(16px); }
    .header .slider:before { background: #fff; }

    /* ---- 主操作：整页翻译（深色实心） ---- */
    .cta {
      width: 100%; border: none; cursor: pointer;
      height: 42px; border-radius: 11px;
      font-size: 13px; font-weight: 600; color: #fff;
      font-family: inherit; letter-spacing: 0.01em;
      background: linear-gradient(160deg, #26292f, #121317);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 1px 2px rgba(16, 17, 20, 0.2);
      transition: filter 0.15s, transform 0.12s;
    }
    .cta:hover { filter: brightness(1.18); }
    .cta:active { transform: translateY(1px); }
    .cta svg { flex-shrink: 0; }

    /* ---- 次操作：两列按钮 ---- */
    .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .tool-btn {
      min-height: 40px; padding: 7px 10px; border: 1px solid var(--hair); border-radius: 10px;
      background: var(--surface); color: var(--ink); font: 600 12.5px var(--font);
      display: flex; align-items: center; justify-content: center; gap: 7px;
      cursor: pointer; letter-spacing: 0.01em;
      transition: background 0.15s, border-color 0.15s;
    }
    .tool-btn:hover { background: var(--canvas); border-color: rgba(16, 17, 20, 0.17); }
    .tool-btn svg { flex-shrink: 0; color: var(--accent); opacity: 0.85; }

    /* ---- AI 操作：蓝色描边 ---- */
    .ai-cta {
      width: 100%; height: 38px; cursor: pointer;
      border: 1px solid var(--accent-line); border-radius: 10px;
      background: var(--accent-soft); color: var(--accent-2);
      font: 600 12.5px var(--font); letter-spacing: 0.01em;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: background 0.15s, border-color 0.15s;
    }
    .ai-cta:hover { background: rgba(51, 85, 209, 0.16); border-color: var(--accent); }
    .ai-cta svg { flex-shrink: 0; }

    .foot {
      text-align: center; font-size: 11.5px; color: var(--ink-3);
      padding: 4px 16px 13px;
    }
    .foot a {
      color: var(--ink-2); text-decoration: none;
      border-bottom: 1px solid rgba(16, 17, 20, 0.2); padding-bottom: 1px;
    }
    .foot a:hover { color: var(--ink); border-color: var(--ink); }

    /* ---- 页面连接状态 ---- */
    .tab-status {
      display: flex; align-items: center; gap: 8px;
      font-size: 11.5px;
      padding: 9px 12px;
      border-radius: 10px;
      background: var(--canvas);
      color: var(--ink-2);
      border: 1px solid var(--hair-2);
    }
    .tab-status::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: #9aa0ab; flex-shrink: 0;
    }
    .tab-status.ok { color: var(--ok); }
    .tab-status.ok::before { background: var(--ok); }
    .tab-status.bad { color: var(--err); }
    .tab-status.bad::before { background: var(--err); }
    .tab-status a { color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
    button:disabled { opacity: 0.55; cursor: wait; }
    details summary { cursor: pointer; font-weight: 600; font-size: 12.5px; }
    details summary::marker { color: var(--ink-3); }
    #glossary { width: 100%; min-height: 120px; padding: 9px; resize: vertical; border: 1px solid var(--hair); border-radius: 8px; font: 12px/1.6 var(--font); }
    #glossary:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    #glossaryStatus { white-space: pre-wrap; }
    .hint.error { color: var(--err); }
    .mini-btn {
      height: 27px; padding: 0 11px; border: 1px solid var(--hair); border-radius: 8px;
      background: var(--surface); color: var(--ink-2);
      font: 600 11.5px var(--font); letter-spacing: 0.01em; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      transition: background 0.15s, color 0.15s;
    }
    .mini-btn:hover { background: var(--canvas); color: var(--ink); }
    .mini-btn svg { flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">译</div>
    <div>
      <h1>中英互译助手</h1>
      <p class="sub">任意网页 · 中英互译 · 写作与阅读</p>
    </div>
    <label class="switch" title="启用插件">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="body">
    <div class="section">
      <div id="tabStatus" class="tab-status">正在检测当前页面…</div>
    </div>

    <div class="section">
      <button id="pageBtn" class="cta" type="button">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="8" r="6.2" />
          <path d="M1.8 8h12.4" />
          <path d="M8 1.8C10.2 3.5 11.3 5.6 11.3 8S10.2 12.5 8 14.2C5.8 12.5 4.7 10.4 4.7 8S5.8 3.5 8 1.8Z" />
        </svg>
        翻译整个页面
      </button>
      <div class="tool-grid">
        <button id="replyBtn" class="tool-btn" type="button">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.5 3.2h11v7.3H7.8L4.6 13v-2.5H2.5z" />
          </svg>
          写回复 · 查漏
        </button>
        <button id="offerBtn" class="tool-btn" type="button">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="6.7" cy="6.7" r="4.2" />
            <path d="M10 10l3.3 3.3" />
          </svg>
          提取要点
        </button>
      </div>
      <p class="hint" id="toolStatus" role="status">写回复含译文预览与发送前查漏；选中文字后右键也能用。AI 功能需配置 Key。</p>
    </div>

    <!-- 翻译引擎 -->
    <div class="section">
      <div class="section-title">翻译引擎</div>
      <div class="row">
        <span>当前引擎 <span class="badge" id="engineBadge">免费版</span></span>
        <select id="provider">
          <option value="google">Google（免费）</option>
          <option value="ai">AI 大模型（更自然）</option>
        </select>
      </div>
      <div class="ai-box" id="aiBox">
        <div class="field">
          <label>服务商预设</label>
          <select id="aiPreset">
            <option value="deepseek">DeepSeek（支持看图）</option>
            <option value="openrouter">OpenRouter（聚合）</option>
            <option value="siliconflow">硅基流动 SiliconFlow</option>
            <option value="openai">OpenAI 官方</option>
            <option value="custom">自定义 (OpenAI 兼容)</option>
          </select>
        </div>
        <div class="field">
          <label>API Base URL</label>
          <input type="text" id="aiBaseUrl" placeholder="https://api.deepseek.com" />
        </div>
        <div class="field">
          <label>API Key</label>
          <input type="password" id="aiApiKey" placeholder="粘贴你的 API Key" />
        </div>
        <div class="field">
          <label>模型名称</label>
          <input type="text" id="aiModel" placeholder="deepseek-flash" />
        </div>
      </div>
      <div class="hint" id="statusHint"></div>
    </div>

    <!-- 翻译偏好 -->
    <div class="section">
      <div class="section-title">翻译偏好</div>
      <div class="row">
        <span>输入框翻译目标</span>
        <select id="inputTargetLang">
          <option value="en">英文 English</option>
          <option value="zh-CN">中文 简体</option>
        </select>
      </div>
      <div class="row">
        <span>屏幕选中翻译到</span>
        <select id="selTargetLang">
          <option value="zh-CN">中文 简体</option>
          <option value="zh-TW">中文 繁體</option>
          <option value="en">英文 English</option>
        </select>
      </div>
    </div>

    <!-- 个人术语表 -->
    <div class="section">
      <details>
        <summary>个人术语表</summary>
        <p class="hint" id="glossaryHelp">每行一条：中文 = English。中英互译自动反向应用；如需保留原词，填写 VPS = VPS。最多 100 条，仅保存在本机。</p>
        <label for="glossary">固定译法</label>
        <textarea id="glossary" maxlength="12000" aria-describedby="glossaryHelp" placeholder="续费价 = renewal price&#10;流量 = bandwidth&#10;VPS = VPS"></textarea>
        <button id="saveGlossary" class="tool-btn" type="button" style="width: 100%; margin-top: 8px;">保存术语表</button>
        <p id="glossaryStatus" class="hint" role="status"></p>
      </details>
    </div>

    <!-- 快捷方式 -->
    <div class="section">
      <div class="section-title">快捷方式</div>
      <div class="row">
        <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 预览译文</span>
        <label class="switch">
          <input type="checkbox" id="hotkeyEnabled" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="row">
        <span>划词翻译方式</span>
        <select id="selMode">
          <option value="icon">先出图标，点击翻译</option>
          <option value="direct">选完立即翻译</option>
          <option value="off">关闭划词翻译</option>
        </select>
      </div>
    </div>

    <!-- AI 看屏幕 -->
    <div class="section">
      <button id="explainBtn" class="ai-cta" type="button">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1.6 8S4 4.2 8 4.2 14.4 8 14.4 8 12 11.8 8 11.8 1.6 8 1.6 8z" />
          <circle cx="8" cy="8" r="1.7" />
        </svg>
        AI 看屏幕 · 解读当前页面
      </button>
    </div>

    <!-- 版本与更新 -->
    <div class="section">
      <div class="section-title">版本与更新</div>
      <div class="row">
        <span>当前版本 <span class="badge" id="versionBadge">v?</span></span>
        <button id="checkUpdateBtn" type="button" class="mini-btn">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13.1 8A5.1 5.1 0 1 1 11.6 4.3" />
            <path d="M13.3 1.8v3h-3" />
          </svg>
          检查更新
        </button>
      </div>
      <div class="row">
        <span>每 12 小时自动检查</span>
        <label class="switch">
          <input type="checkbox" id="checkUpdates" />
          <span class="slider"></span>
        </label>
      </div>
      <p class="hint" id="updateStatus" role="status"></p>
    </div>

    <div class="foot">
      获取 Key：
      <a href="https://platform.deepseek.com" target="_blank" rel="noopener">DeepSeek</a> ·
      <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">OpenRouter</a> ·
      <a href="https://cloud.siliconflow.cn" target="_blank" rel="noopener">硅基流动</a> ·
      <a href="https://github.com/joyiok/chinese-english-helper" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
